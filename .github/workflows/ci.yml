name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'cli/**'
      - 'components/**'
      - 'types/**'
      - 'templates/**'
      - 'styles/**'
      - 'tests/**'
      - 'tsconfig.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'cli/**'
      - 'components/**'
      - 'types/**'
      - 'templates/**'
      - 'styles/**'
      - 'tests/**'
      - 'tsconfig.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        run: |
          echo "Scanning for hardcoded secrets..."
          cat > /tmp/secret-patterns.txt <<PATTERNS
          PRIVATE.KEY
          sk_live_
          sk_test_
          aws_secret
          PATTERNS
          FOUND=0
          while IFS= read -r pattern; do
            pattern=$(echo "$pattern" | xargs)
            [ -z "$pattern" ] && continue
            if git grep -lI "$pattern" -- ':!*.md' ':!.github/workflows/*' ':!node_modules' 2>/dev/null; then
              echo "FAIL: potential secret pattern '$pattern' found"
              FOUND=1
            fi
          done < /tmp/secret-patterns.txt
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "No hardcoded secrets detected"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  validate-templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [default, docs, product, portfolio, app]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Create temp project
        run: |
          mkdir -p /tmp/test-${{ matrix.template }}
          echo '{"name":"test-${{ matrix.template }}","version":"1.0.0","description":"template validation"}' > /tmp/test-${{ matrix.template }}/package.json

      - name: Scaffold with template
        run: |
          cd /tmp/test-${{ matrix.template }}
          node $GITHUB_WORKSPACE/cli/init.mjs init --template ${{ matrix.template }}

      - name: Pack theme for local install
        run: npm pack --pack-destination /tmp/

      - name: Install site deps
        working-directory: /tmp/test-${{ matrix.template }}/site
        run: npm install /tmp/mcptoolshop-site-theme-*.tgz

      - name: Build site
        working-directory: /tmp/test-${{ matrix.template }}/site
        run: npm run build
