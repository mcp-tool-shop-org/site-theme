name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'cli/**'
      - 'components/**'
      - 'types/**'
      - 'templates/**'
      - 'styles/**'
      - 'tests/**'
      - 'tsconfig.json'
      - '.github/workflows/**'
      - 'atlas/**'
      # Codecov reads its status and comment settings from this file.
      - 'codecov.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'cli/**'
      - 'components/**'
      - 'types/**'
      - 'templates/**'
      - 'styles/**'
      - 'tests/**'
      - 'tsconfig.json'
      - '.github/workflows/**'
      - 'atlas/**'
      # Codecov reads its status and comment settings from this file.
      - 'codecov.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # 'true' on a pull request or a push to the default branch, the runs
      # whose coverage and test results go to Codecov.
      COVERAGE_LEG: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.22.0 check

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        # Peer astro is a consumer runtime, not this package's tree. Audit our
        # own lock (devDeps + overrides) so the theme's zero-runtime-dep
        # tarball is not blocked by upstream Astro XSS advisories.
        run: npm audit --audit-level=high --omit=peer

      - name: Secret scan
        run: |
          echo "Scanning for hardcoded secrets..."
          cat > /tmp/secret-patterns.txt <<PATTERNS
          PRIVATE.KEY
          sk_live_
          sk_test_
          aws_secret
          PATTERNS
          FOUND=0
          while IFS= read -r pattern; do
            pattern=$(echo "$pattern" | xargs)
            [ -z "$pattern" ] && continue
            if git grep -lI "$pattern" -- ':!*.md' ':!.github/workflows/*' ':!node_modules' 2>/dev/null; then
              echo "FAIL: potential secret pattern '$pattern' found"
              FOUND=1
            fi
          done < /tmp/secret-patterns.txt
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "No hardcoded secrets detected"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        id: tests
        run: npm test -- --coverage.enabled=${{ env.COVERAGE_LEG == 'true' }} --reporter=default --reporter=junit --outputFile.junit=junit.xml

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: lint-and-test
    if: ${{ !cancelled() && needs.lint-and-test.result != 'cancelled' && needs.lint-and-test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: coverage

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .

      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.lint-and-test.result == 'success' || hashFiles('coverage/coverage-final.json') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/coverage-final.json

      - name: Upload test results to Codecov
        if: ${{ needs.lint-and-test.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  validate-templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [default, docs, product, portfolio, app, tool]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Create temp project
        run: |
          mkdir -p /tmp/test-${{ matrix.template }}
          echo '{"name":"test-${{ matrix.template }}","version":"1.0.0","description":"template validation"}' > /tmp/test-${{ matrix.template }}/package.json

      - name: Scaffold with template
        run: |
          cd /tmp/test-${{ matrix.template }}
          node $GITHUB_WORKSPACE/cli/init.mjs init --template ${{ matrix.template }}

      - name: Pack theme for local install
        run: npm pack --pack-destination /tmp/

      - name: Install site deps
        working-directory: /tmp/test-${{ matrix.template }}/site
        run: npm install /tmp/mcptoolshop-site-theme-*.tgz

      - name: Build site
        working-directory: /tmp/test-${{ matrix.template }}/site
        run: npm run build
